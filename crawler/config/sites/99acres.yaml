# 99acres.com Configuration - RealSlate Core
# Pan-India BUY + RENT coverage
# Last validated: 2026-02

site:
  name: "99acres"
  base_url: "https://www.99acres.com"
  enabled: true
  priority: 1
  
  min_delay_seconds: 6
  max_delay_seconds: 20
  max_pages_per_day: 500

listing_types:
  - buy
  - rent

