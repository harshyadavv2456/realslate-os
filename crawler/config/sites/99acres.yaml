selectors:
  listing_container:
    - selector: ".srpWrap"
      type: "css"
    - selector: "#srpTuple"
      type: "css"
    - selector: "section.pageComponent"
      type: "css"
      
  listing_card:
    - selector: "[id^='srpTuple_']"
      type: "css"
    - selector: ".tupleNew__outerTupleWrap"
      type: "css"
    - selector: "section.srpTuple"
      type: "css"
    - selector: ".tupleNew"
      type: "css"
      
  next_page:
    - selector: "a.pageNext"
      type: "css"
    - selector: "[data-page='next']"
      type: "css"
    - selector: "a[title='Next']"
      type: "css"

  price:
    - selector: ".tupleNew__priceWrap span"
      type: "css"
      attribute: "text"
    - selector: ".tupleNew__priceValWrap span"
      type: "css"
      attribute: "text"
    - selector: "[data-label='price']"
      type: "css"
      attribute: "text"
    - selector: ".tupleNew__price"
      type: "css"
      attribute: "text"
      
  address:
    - selector: ".tupleNew__locationName"
      type: "css"
      attribute: "text"
    - selector: ".tupleNew__propTitle"
      type: "css"
      attribute: "text"
    - selector: ".tupleNew__society"
      type: "css"
      attribute: "text"
      
  locality:
    - selector: ".tupleNew__locationName"
      type: "css"
      attribute: "text"
    - selector: ".tupleNew__localityName"
      type: "css"
      attribute: "text"
      
  beds:
    - selector: ".tupleNew__area1Type"
      type: "css"
      attribute: "text"
    - selector: "[data-label='bedroom']"
      type: "css"
      attribute: "text"
    - selector: ".configurationCards span"
      type: "css"
      attribute: "text"
      index: 0
      
  bathrooms:
    - selector: ".tupleNew__bathVal"
      type: "css"
      attribute: "text"
    - selector: "[data-label='bathroom']"
      type: "css"
      attribute: "text"
      
  area:
    - selector: ".tupleNew__builtupArea"
      type: "css"
      attribute: "text"
    - selector: ".tupleNew__areaWrap span"
      type: "css"
      attribute: "text"
    - selector: "[data-label='area']"
      type: "css"
      attribute: "text"
    - selector: ".tupleNew__superArea"
      type: "css"
      attribute: "text"
      
  detail_link:
    - selector: ".tupleNew__heading a"
      type: "css"
      attribute: "href"
    - selector: ".tupleNew__propTitle a"
      type: "css"
      attribute: "href"
    - selector: "a[href*='/property/']"
      type: "css"
      attribute: "href"
      
  property_type:
    - selector: ".tupleNew__propType"
      type: "css"
      attribute: "text"
    - selector: ".tupleNew__area1Type"
      type: "css"
      attribute: "text"
      
  posted_date:
    - selector: ".tupleNew__postedOn"
      type: "css"
      attribute: "text"
    - selector: "[data-label='posted']"
      type: "css"
      attribute: "text"
      
  builder_name:
    - selector: ".tupleNew__developerName"
      type: "css"
      attribute: "text"
    - selector: ".tupleNew__agentDetail"
      type: "css"
      attribute: "text"
      
  description:
    - selector: ".tupleNew__descText"
      type: "css"
      attribute: "text"
    - selector: ".tupleNew__desc"
      type: "css"
      attribute: "text"
      
  floor:
    - selector: "[data-label='floor']"
      type: "css"
      attribute: "text"
      
  furnishing:
    - selector: "[data-label='furnishing']"
      type: "css"
      attribute: "text"
      
  facing:
    - selector: "[data-label='facing']"
      type: "css"
      attribute: "text"

pagination:
  type: "url_param"
  max_pages: 50
  url_param: "page"
  start_page: 1
  
  total_count_selector: ".srpHeading__tupCnt"

transformations:
  price:
    - action: "regex"
      pattern: "[₹,\\s]"
      replacement: ""
    - action: "convert_indian_notation"
      
  area:
    - action: "regex"
      pattern: "[^0-9.]"
      replacement: ""
    - action: "to_float"
    
  beds:
    - action: "regex"
      pattern: "(\\d+)\\s*BHK"
      group: 1
    - action: "to_int"

anti_bot:
  cloudflare_bypass: false
  captcha_handling: "skip"
  
  headers:
    Accept-Language: "en-IN,en;q=0.9"
    Referer: "https://www.99acres.com"
