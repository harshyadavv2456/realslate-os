selectors:
  listing_container:
    - selector: "#srchRslts"
      type: "css"
    - selector: ".mb-srp__list"
      type: "css"
    - selector: "div[data-labelname='SRP-Card']"
      type: "css"
      
  listing_card:
    - selector: ".mb-srp__card"
      type: "css"
    - selector: "[data-id]"
      type: "css"
    - selector: "div.mb-srp__card--body"
      type: "css"
      
  next_page:
    - selector: "a.mb-pagination__next"
      type: "css"
    - selector: "[data-page='next']"
      type: "css"

  price:
    - selector: ".mb-srp__card__price--amount"
      type: "css"
      attribute: "text"
    - selector: "[data-summary='price'] span"
      type: "css"
      attribute: "text"
    - selector: ".mb-srp__card__price"
      type: "css"
      attribute: "text"
      
  address:
    - selector: ".mb-srp__card__society--name"
      type: "css"
      attribute: "text"
    - selector: ".mb-srp__card--title"
      type: "css"
      attribute: "text"
    - selector: ".mb-srp__card__society--name--a"
      type: "css"
      attribute: "text"
      
  locality:
    - selector: ".mb-srp__card__society--name + a"
      type: "css"
      attribute: "text"
    - selector: ".mb-srp__card__locality"
      type: "css"
      attribute: "text"
      
  beds:
    - selector: ".mb-srp__card__summary--value"
      type: "css"
      attribute: "text"
      index: 0
    - selector: "[data-summary='bedroom']"
      type: "css"
      attribute: "text"
    - selector: ".mb-srp__card__summary__list--item:first-child .mb-srp__card__summary--value"
      type: "css"
      attribute: "text"
      
  bathrooms:
    - selector: ".mb-srp__card__summary__list--item:nth-child(2) .mb-srp__card__summary--value"
      type: "css"
      attribute: "text"
    - selector: "[data-summary='bathroom']"
      type: "css"
      attribute: "text"
      
  area:
    - selector: ".mb-srp__card__summary__list--item:nth-child(3) .mb-srp__card__summary--value"
      type: "css"
      attribute: "text"
    - selector: "[data-summary='area']"
      type: "css"
      attribute: "text"
    - selector: ".mb-srp__card__area"
      type: "css"
      attribute: "text"
      
  detail_link:
    - selector: ".mb-srp__card__title--link"
      type: "css"
      attribute: "href"
    - selector: ".mb-srp__card a[href*='/property-details']"
      type: "css"
      attribute: "href"
    - selector: "a[href*='/buy-']"
      type: "css"
      attribute: "href"
      
  property_type:
    - selector: ".mb-srp__card__estimate--description"
      type: "css"
      attribute: "text"
    - selector: ".mb-srp__card__type"
      type: "css"
      attribute: "text"
      
  posted_date:
    - selector: ".mb-srp__card__date"
      type: "css"
      attribute: "text"
    - selector: "[data-summary='age']"
      type: "css"
      attribute: "text"
      
  builder_name:
    - selector: ".mb-srp__card__developer__name"
      type: "css"
      attribute: "text"
    - selector: ".mb-srp__card__ads--name"
      type: "css"
      attribute: "text"
      
  description:
    - selector: ".mb-srp__card--desc"
      type: "css"
      attribute: "text"
    - selector: ".mb-srp__card__summary--desc"
      type: "css"
      attribute: "text"
      
  amenities:
    - selector: ".mb-srp__card__amenities li"
      type: "css"
      attribute: "text"
      multiple: true
      
  floor:
    - selector: "[data-summary='floor']"
      type: "css"
      attribute: "text"
      
  furnishing:
    - selector: "[data-summary='furnishing']"
      type: "css"
      attribute: "text"

pagination:
  type: "url_param"
  max_pages: 50
  url_param: "page"
  start_page: 1

transformations:
  price:
    - action: "regex"
      pattern: "[₹,\\s]"
      replacement: ""
    - action: "convert_indian_notation"
      
  area:
    - action: "regex"
      pattern: "[^0-9.]"
      replacement: ""
    - action: "to_float"
    
  beds:
    - action: "regex"
      pattern: "(\\d+)"
      group: 1
    - action: "to_int"
    
  bathrooms:
    - action: "regex"
      pattern: "(\\d+)"
      group: 1
    - action: "to_int"

anti_bot:
  cloudflare_bypass: false
  captcha_handling: "skip"
  
  headers:
    Accept-Language: "en-IN,en;q=0.9"
