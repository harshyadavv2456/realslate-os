selectors:
  listing_container:
    - selector: "[class*='card-list']"
      type: "css"
    - selector: "[class*='property-list']"
      type: "css"
    - selector: "[class*='nb__card-container']"
      type: "css"
      
  listing_card:
    - selector: "[class*='nb-card']"
      type: "css"
    - selector: "article[class*='card']"
      type: "css"
    - selector: "[data-property-id]"
      type: "css"
    - selector: "[class*='card-info']"
      type: "css"
      
  next_page:
    - selector: "button[class*='next']"
      type: "css"
    - selector: "[aria-label='Next']"
      type: "css"

  price:
    - selector: "[class*='heading-price']"
      type: "css"
      attribute: "text"
    - selector: "[class*='price']"
      type: "css"
      attribute: "text"
    - selector: "[class*='rent']"
      type: "css"
      attribute: "text"
      
  address:
    - selector: "[class*='detail-header']"
      type: "css"
      attribute: "text"
    - selector: "[class*='address']"
      type: "css"
      attribute: "text"
    - selector: "[class*='title']"
      type: "css"
      attribute: "text"
      
  locality:
    - selector: "[class*='locality']"
      type: "css"
      attribute: "text"
    - selector: "[class*='sublocality']"
      type: "css"
      attribute: "text"
    - selector: "[class*='location']"
      type: "css"
      attribute: "text"
      
  beds:
    - selector: "[class*='bhk']"
      type: "css"
      attribute: "text"
    - selector: "[class*='bedroom']"
      type: "css"
      attribute: "text"
    - selector: "[class*='config']"
      type: "css"
      attribute: "text"
      
  bathrooms:
    - selector: "[class*='bath']"
      type: "css"
      attribute: "text"
    - selector: "[class*='bathroom']"
      type: "css"
      attribute: "text"
      
  area:
    - selector: "[class*='area']"
      type: "css"
      attribute: "text"
    - selector: "[class*='sqft']"
      type: "css"
      attribute: "text"
    - selector: "[class*='carpet']"
      type: "css"
      attribute: "text"
      
  detail_link:
    - selector: "a[href*='/property/']"
      type: "css"
      attribute: "href"
    - selector: "[class*='card'] a[href]"
      type: "css"
      attribute: "href"
      
  property_type:
    - selector: "[class*='property-type']"
      type: "css"
      attribute: "text"
    - selector: "[class*='type']"
      type: "css"
      attribute: "text"
      
  posted_date:
    - selector: "[class*='posted']"
      type: "css"
      attribute: "text"
    - selector: "[class*='date']"
      type: "css"
      attribute: "text"
      
  description:
    - selector: "[class*='description']"
      type: "css"
      attribute: "text"
    - selector: "[class*='desc']"
      type: "css"
      attribute: "text"
      
  builder_name:
    - selector: "[class*='owner']"
      type: "css"
      attribute: "text"
    - selector: "[class*='agent']"
      type: "css"
      attribute: "text"

pagination:
  type: "infinite_scroll"
  max_scrolls: 100
  scroll_wait_seconds: 3

transformations:
  price:
    - action: "convert_indian_notation"
      
  area:
    - action: "regex"
      pattern: "[^0-9.]"
      replacement: ""
    - action: "to_float"

anti_bot:
  cloudflare_bypass: true
  captcha_handling: "skip"
