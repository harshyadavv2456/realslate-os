# NoBroker.com Configuration - RealSlate Core
# Pan-India BUY + RENT coverage (expanded from 5 to 24 cities)
# Last validated: 2026-02

site:
  name: "NoBroker"
  base_url: "https://www.nobroker.in"
  enabled: true
  priority: 2
  
  min_delay_seconds: 10
  max_delay_seconds: 35
  max_pages_per_day: 300

listing_types:
  - buy
  - rent

