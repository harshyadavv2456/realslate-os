selectors:
  listing_container:
    - selector: "[class*='infinite-scroll']"
      type: "css"
    - selector: "[class*='SearchResult']"
      type: "css"
    - selector: "[data-q='search-results']"
      type: "css"
    - selector: "[class*='listing-container']"
      type: "css"
      
  listing_card:
    - selector: "[class*='SearchCard']"
      type: "css"
    - selector: "[class*='listing-card']"
      type: "css"
    - selector: "[data-testid='search-card']"
      type: "css"
    - selector: "[class*='PropertyCard']"
      type: "css"
      
  next_page:
    - selector: "[class*='pagination-next']"
      type: "css"
    - selector: "button[aria-label='Next']"
      type: "css"

  price:
    - selector: "[class*='Price']"
      type: "css"
      attribute: "text"
    - selector: "[class*='price']"
      type: "css"
      attribute: "text"
    - selector: "[class*='amount']"
      type: "css"
      attribute: "text"
      
  address:
    - selector: "[class*='Address']"
      type: "css"
      attribute: "text"
    - selector: "[class*='address']"
      type: "css"
      attribute: "text"
    - selector: "[class*='title']"
      type: "css"
      attribute: "text"
      
  locality:
    - selector: "[class*='locality']"
      type: "css"
      attribute: "text"
    - selector: "[class*='Locality']"
      type: "css"
      attribute: "text"
    - selector: "[class*='location']"
      type: "css"
      attribute: "text"
      
  beds:
    - selector: "[class*='Bedroom']"
      type: "css"
      attribute: "text"
    - selector: "[class*='bhk']"
      type: "css"
      attribute: "text"
    - selector: "[class*='bed']"
      type: "css"
      attribute: "text"
      
  bathrooms:
    - selector: "[class*='Bathroom']"
      type: "css"
      attribute: "text"
    - selector: "[class*='bath']"
      type: "css"
      attribute: "text"
      
  area:
    - selector: "[class*='Area']"
      type: "css"
      attribute: "text"
    - selector: "[class*='super-area']"
      type: "css"
      attribute: "text"
    - selector: "[class*='carpet']"
      type: "css"
      attribute: "text"
    - selector: "[class*='sqft']"
      type: "css"
      attribute: "text"
      
  detail_link:
    - selector: "[class*='SearchCard'] a"
      type: "css"
      attribute: "href"
    - selector: "a[href*='/buy/']"
      type: "css"
      attribute: "href"
    - selector: "a[href*='/rent/']"
      type: "css"
      attribute: "href"
    - selector: "[class*='PropertyCard'] a"
      type: "css"
      attribute: "href"
      
  property_type:
    - selector: "[class*='PropertyType']"
      type: "css"
      attribute: "text"
    - selector: "[class*='property-type']"
      type: "css"
      attribute: "text"
    - selector: "[class*='type']"
      type: "css"
      attribute: "text"
      
  posted_date:
    - selector: "[class*='PostedDate']"
      type: "css"
      attribute: "text"
    - selector: "[class*='posted']"
      type: "css"
      attribute: "text"
      
  builder_name:
    - selector: "[class*='Developer']"
      type: "css"
      attribute: "text"
    - selector: "[class*='builder']"
      type: "css"
      attribute: "text"
    - selector: "[class*='agent']"
      type: "css"
      attribute: "text"
      
  description:
    - selector: "[class*='Description']"
      type: "css"
      attribute: "text"
    - selector: "[class*='description']"
      type: "css"
      attribute: "text"

pagination:
  type: "infinite_scroll"
  max_scrolls: 50
  scroll_wait_seconds: 2

transformations:
  price:
    - action: "convert_indian_notation"
      
  area:
    - action: "regex"
      pattern: "[^0-9.]"
      replacement: ""
    - action: "to_float"

anti_bot:
  cloudflare_bypass: false
  captcha_handling: "skip"
