# Housing.com Configuration - RealSlate Core
# Pan-India BUY + RENT coverage (expanded from 6 to 24 cities)
# Last validated: 2026-02

site:
  name: "Housing.com"
  base_url: "https://housing.com"
  enabled: true
  priority: 1
  
  min_delay_seconds: 8
  max_delay_seconds: 25
  max_pages_per_day: 400

listing_types:
  - buy
  - rent

